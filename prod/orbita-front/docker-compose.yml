name: orbita-front
services:
  app:
    image: larux/orbita-front:latest
    environment:
      NODE_ENV: production
      APP_ENV: production
      ORIGIN: ${ORIGIN:?Configure public HTTPS origin}
      ORBITA_PUBLIC_URL: ${ORBITA_PUBLIC_URL:-${APP_URL}}
      ORBITA_IMAGE_URL: ${ORBITA_IMAGE_URL:-https://lumen-image-bucket.s3.eu-central-1.amazonaws.com/images/}
      ORBITA_DEMO: 'false'
      ORBITA_API_ORIGIN_INTERNAL: ${ORBITA_API_ORIGIN_INTERNAL:-${ORIGIN}}
      ORBITA_API_URL_INTERNAL: ${ORBITA_API_URL_INTERNAL:-${ORIGIN}/graphql}
      ORBITA_ONLINE_PAYMENT_ENABLED: ${PAYMENTS_ENABLED:-false}
      ORBITA_ANALYTICS_ENABLED: ${ORBITA_ANALYTICS_ENABLED:-false}
      ADDRESS_HEADER: X-Real-IP
    restart: unless-stopped
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,mode=1777"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4151:80"
    volumes:
      - ./nginx/front.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
