name: orbita-admin
services:
  app:
    image: larux/orbita-admin:latest
    environment:
      NODE_ENV: production
      APP_ENV: production
      ORIGIN: ${ORIGIN:?Configure public HTTPS origin}
      ORBITA_API_ORIGIN_INTERNAL: ${ORBITA_API_ORIGIN_INTERNAL:-${ORIGIN}}
      ORBITA_DEMO: 'false'
      ADDRESS_HEADER: X-Real-IP
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:4152:80"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
