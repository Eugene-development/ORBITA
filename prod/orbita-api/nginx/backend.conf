# Only the host nginx can reach this loopback-bound HTTP listener.
map $http_x_forwarded_proto $orbita_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    # The host nginx maintains the sanitized access log.
    access_log off;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php app:9000;

    location ~ /\. { deny all; }
    location / {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $orbita_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_pass $php;
        fastcgi_read_timeout 60s;
    }
}
