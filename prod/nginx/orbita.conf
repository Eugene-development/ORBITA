# Host nginx: /etc/nginx/sites-available/orbita
# Enable HTTP first, then: certbot --nginx -d xn----7sbc2ahzelejid.xn--p1ai --redirect
# Preserve Certbot's TLS changes on subsequent application updates.
log_format orbita '$remote_addr $request_method $uri $status';
server {
    listen 80;
    server_name xn----7sbc2ahzelejid.xn--p1ai;
    client_max_body_size 12m;
    access_log /var/log/nginx/orbita_access.log orbita;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 60s;

    location = /admin { return 308 /admin/; }
    location /admin/ { proxy_pass http://127.0.0.1:4152; }
    location /auth/ { proxy_pass http://127.0.0.1:7151; }
    location = /graphql { proxy_pass http://127.0.0.1:7151; }
    location /api/ { proxy_pass http://127.0.0.1:7151; }
    location /media/ { proxy_pass http://127.0.0.1:7151; }
    location = /health/api { proxy_pass http://127.0.0.1:7151/health; }
    location ~ /\. { deny all; }
    location / { proxy_pass http://127.0.0.1:4151; }
}
