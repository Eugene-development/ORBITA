name: orbita-api
x-runtime: &runtime
  image: larux/orbita-api:latest
  env_file: ${ORBITA_PROD_ENV_FILE:-.env}
  environment:
    APP_KEY: ${APP_KEY:?Set the permanent APP_KEY in .env}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    MYSQL_ATTR_SSL_CA: /run/certs/mysql-ca.pem
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777
    - /var/www/storage/framework:rw,noexec,nosuid,nodev,uid=82,gid=82,mode=0770
    - /var/www/storage/logs:rw,noexec,nosuid,nodev,uid=82,gid=82,mode=0770
    - /var/www/bootstrap/cache:rw,noexec,nosuid,nodev,uid=82,gid=82,mode=0770
  volumes:
    - ./cert/mysql-ca.pem:/run/certs/mysql-ca.pem:ro
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [default, database]
  depends_on:
    redis: {condition: service_healthy}
services:
  app:
    <<: *runtime
    healthcheck:
      test: [CMD-SHELL, 'SCRIPT_NAME=/index.php SCRIPT_FILENAME=/var/www/public/index.php REQUEST_METHOD=GET REQUEST_URI=/health cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q ''"status":"ok"''']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  worker:
    <<: *runtime
    command: [php, artisan, orbita:outbox-work, --sleep=3]
    stop_grace_period: 75s
  scheduler:
    <<: *runtime
    command: [php, artisan, schedule:work]
    stop_grace_period: 75s
  db:
    <<: *runtime
    image: larux/orbita-db:latest
    profiles: [tools]
    env_file:
      - ${ORBITA_PROD_ENV_FILE:-.env}
      - path: .env.migrate
        required: false
    # Override the anchor's DB_PASSWORD interpolation: migration env must take precedence.
    environment:
      APP_KEY: ${APP_KEY:?Set the permanent APP_KEY in .env}
      MYSQL_ATTR_SSL_CA: /run/certs/mysql-ca.pem
    restart: "no"
    command: [php, artisan, migrate, --path=/migrations, --realpath, --force]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 10s, retries: 10}
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:7151:80"]
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.94.0/24
  database:
    external: true
    name: ${DB_NETWORK:-leget-db}
volumes:
  redis_data:
    name: orbita-production_redis_data
