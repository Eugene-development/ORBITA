map $http_x_forwarded_proto $orbita_proto { default $scheme; https https; }
map $orbita_proto $orbita_https { default ''; https on; }
log_format orbita '$remote_addr $request_method $uri $status';
server {
  listen 80; server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $front front:3000; set $admin admin:3000; set $api api:9000;
  access_log /var/log/nginx/access.log orbita;
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /admin { return 308 /admin/; }
  location /admin/ {
    proxy_pass http://$admin;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $orbita_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/(graphql$|auth/|api/|media/) {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    fastcgi_param HTTPS $orbita_https;
    fastcgi_param HTTP_X_FORWARDED_PROTO $orbita_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_pass $api;
  }
  location = /health/api {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
    fastcgi_param HTTPS $orbita_https;
    fastcgi_param REQUEST_URI /health;
    fastcgi_param HTTP_X_FORWARDED_PROTO $orbita_proto;
    fastcgi_pass $api;
  }
  location ~ /\. { deny all; }
  location / {
    proxy_pass http://$front;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $orbita_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
